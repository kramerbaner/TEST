<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Video Downloader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="titlebar"></div>

  <main class="container">
    <header class="app-header">
      <h1>Video Downloader</h1>
      <p class="subtitle">YouTube · Facebook · Twitter / X · i ponad 1000 innych serwisów</p>
    </header>

    <div id="deps-warning" class="warning hidden">
      <strong>Brak wymaganych narzędzi.</strong>
      <div id="deps-detail"></div>
      <div class="warning-help">
        Zainstaluj przez Homebrew w Terminalu:
        <code>brew install yt-dlp ffmpeg</code>
      </div>
    </div>

    <section class="card">
      <label class="field">
        <span class="label">Adres URL</span>
        <input id="url" type="text" placeholder="https://youtube.com/... lub facebook.com/... lub twitter.com/..." autofocus>
      </label>

      <div class="row">
        <label class="field">
          <span class="label">Format</span>
          <select id="format">
            <option value="video">Video (MP4)</option>
            <option value="audio">Tylko audio (MP3)</option>
          </select>
        </label>

        <label class="field" id="quality-field">
          <span class="label">Jakość</span>
          <select id="quality">
            <option value="best">Najlepsza dostępna</option>
            <option value="2160">2160p (4K)</option>
            <option value="1440">1440p (2K)</option>
            <option value="1080" selected>1080p (Full HD)</option>
            <option value="720">720p (HD)</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
          </select>
        </label>
      </div>

      <label class="field">
        <span class="label">Folder docelowy</span>
        <div class="folder-row">
          <input id="folder" type="text" readonly>
          <button id="choose-folder" class="btn-secondary">Zmień...</button>
          <button id="open-folder" class="btn-secondary" title="Otwórz w Finderze">Otwórz</button>
        </div>
      </label>

      <div class="actions">
        <button id="download" class="btn-primary">Pobierz</button>
        <button id="cancel" class="btn-danger hidden">Anuluj</button>
      </div>
    </section>

    <section class="card progress-card hidden" id="progress-card">
      <div class="progress-header">
        <span id="progress-text">Przygotowywanie...</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-meta">
        <span id="progress-speed"></span>
        <span id="progress-eta"></span>
      </div>
    </section>

    <section class="card log-card">
      <details>
        <summary>Log</summary>
        <pre id="log"></pre>
      </details>
    </section>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
